name: Refresh monthly rankings

on:
  schedule:
    # Retry on days 2 and 3 if no complete refresh succeeded this UTC month.
    - cron: "23 4 1-3 * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/monthly-ranking-refresh.yml"

permissions:
  contents: write
  pages: write
  id-token: write

# Serialize data writers with the existing daily feed workflow.
concurrency:
  group: publication-update
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    outputs:
      publish_ready: ${{ steps.ready.outputs.value }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Decide whether this month needs a refresh
        id: due
        run: echo "value=$(python work/refresh_rankings.py --due)" >> "$GITHUB_OUTPUT"
      - name: Install validation dependencies
        run: python -m pip install -r work/literature_requirements.txt
      - name: Check existing data and regression tests
        run: |
          python -m unittest discover -s work -p 'test_*.py'
          node work/test_literature_ui.js
      - name: Retrieve fresh ranking evidence for every pinned profile
        if: steps.due.outputs.value == 'true'
        run: python -u work/refresh_rankings.py
      - name: Validate refreshed exports and rebuild the website
        if: steps.due.outputs.value == 'true'
        run: |
          python -m unittest discover -s work -p 'test_*.py'
          python work/validate_updates_feed.py
          python work/build_website_data.py
          node --check outputs/website/app.js
          node --check outputs/website/data.js
          git diff --check
      - name: Commit the validated snapshot
        if: steps.due.outputs.value == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/dna_replication_researchers.csv outputs/author_resolution_audit.csv outputs/replication_network_nodes.csv outputs/replication_network_edges.csv outputs/replication_community_network.json outputs/replication_community_network.graphml outputs/ranking_refresh.json outputs/ranking_history outputs/website/data.js outputs/website/index.html outputs/README.md
          git commit -m "chore: refresh monthly ranking snapshot"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Mark validated data ready for deployment
        id: ready
        run: |
          echo "value=true" >> "$GITHUB_OUTPUT"
          if [ -f outputs/ranking_refresh.json ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          meta = json.load(open('outputs/ranking_refresh.json'))
          print('## Ranking snapshot\n')
          print('Last complete successful retrieval: ' + meta['last_successful_check_at'])
          print('\nPublication cutoff: ' + meta['publication_cutoff'])
          print('\nRanked researchers: ' + str(meta['ranked_count']))
          print('\n' + meta['sampling'])
          PY
          fi

  # Explicit call is required: commits made with GITHUB_TOKEN do not trigger push workflows.
  # Also redeploy on a catch-up day if retrieval succeeded but a prior deploy failed.
  deploy:
    needs: refresh
    if: needs.refresh.outputs.publish_ready == 'true'
    uses: ./.github/workflows/deploy-pages.yml
