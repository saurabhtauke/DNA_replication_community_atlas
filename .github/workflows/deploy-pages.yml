name: Deploy research atlas to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "outputs/website/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the atlas
        uses: actions/checkout@v4
        with:
          # The refresh caller has just pushed a newer generated-data commit.
          ref: main

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: outputs/website

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
